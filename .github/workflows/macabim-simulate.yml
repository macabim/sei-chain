name: Macabim bundle simulation
on:
  pull_request:
    branches: [production/v6.7]
  push:
    branches: [production/v6.7]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: true
      - name: Test simulation state and RPC behavior with race detection
        run: go test -race -p 2 ./evmrpc ./x/evm/state -run 'TestMacabimSimulateV1|TestSimulation|TestMacabimPending|TestGetTransactionByHash' -count=1 -timeout=20m
      - name: Check formatting
        run: make fmtcheck
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0 run --timeout=15m
      - name: Build node
        run: make build VERSION=v6.7.2-macabim-simulate
      - name: Verify modules
        run: go mod verify
