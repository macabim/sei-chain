name: Macabim WS log validation
on:
  workflow_dispatch:
  push:
    branches:
      - codex/native-ws-getlogs-main
      - codex/native-ws-getlogs-v6.6.3
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Check log transport and existing WebSocket behavior
        run: go test -p 2 ./evmrpc -run '^(TestMacabimWSLogsParity|TestFilterNew|TestFilterUninstall|TestSubscribeNewHeads)$' -count=1 -timeout=15m
      - name: Build node without installing it
        run: make build
